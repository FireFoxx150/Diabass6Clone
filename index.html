<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIABASS 6</title>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem("diabass6.prefs") || "{}");
        var light = p.theme === "light" || (p.theme === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        document.documentElement.style.setProperty("--ts", p.text === "xlarge" ? "1.4" : p.text === "large" ? "1.2" : "1");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
